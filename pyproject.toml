[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omdb-httk"
version = "0.1.0"
description = "Open Materials Database website and OPTIMADE service on httk₂"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httk-serve[default]", "httk-atomistic[default]", "httk-store[db]"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]
browser = ["playwright"]

[project.scripts]
omdb-serve = "omdb.cli:main"
omdb-build = "omdb.migrate:main"

[tool.setuptools]
packages = ["omdb", "omdb.site"]

[tool.setuptools.package-dir]
"omdb.site" = "site"

[tool.setuptools.package-data]
"omdb.site" = ["content/*", "static/*", "templates/*", "widgets/*.py", "widgets/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not real_data'"
markers = ["browser: real browser acceptance", "real_data: opt-in legacy source acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
